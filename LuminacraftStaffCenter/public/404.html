<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f14" />
    <title>Luminacraft Staff Center — yönlendiriliyor</title>
    <script>
      // GitHub Pages SPA yönlendirme şeması:
      // public/404.html, istenen yolu encodeURIComponent(path) ile kodlar ve
      // "/?/kodlanmis-yol" adresine yönlendirir. Baştaki "/" kodlanmaz;
      // index.html search.slice(1) ile gelen "/" ve kodu birleştirir.
      (function () {
        var search = window.location.search
        var tamYol = window.location.pathname + window.location.search + window.location.hash

        // GitHub Pages proje sitelerinde ilk yol bileşeni depo adıdır (VITE_BASE_PATH).
        var bolumler = window.location.pathname.split('/')
        var depo = bolumler[1] || ''
        var taban = depo ? '/' + depo + '/' : '/'
        var path = tamYol.replace(/^\//, '')

        if (search.indexOf('?/') === 0) {
          // index.html ile birebir aynı geri yükleme adımı.
          path = decodeURIComponent(search.slice(1))
          window.history.replaceState(null, '', path + window.location.hash)
        } else {
          // Derin bağlantı: base path dahil tam yolu kodlayıp ana sayfaya dön.
          window.location.replace(taban + '?/' + encodeURIComponent(path))
        }
      })()
    </script>
  </head>
  <body>
    <p>Yönlendiriliyor… Eğer otomatik yönlendirme olmazsa <a href="./">ana sayfaya</a> tıklayın.</p>
  </body>
</html>
